<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movimientos · Comida Rápida</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body><div class="shell"><div th:replace="~{fragments/sidebar :: sidebar('movimientos', ${sessionRole})}"></div><main class="main"><div th:replace="~{fragments/topbar :: topbar('Inventario','Movimientos')}"></div><section class="content">
<div class="page-head"><div><h2>Movimientos de inventario</h2><p>Historial de entradas y salidas aplicadas a materias primas.</p></div><a class="btn btn-primary" th:href="@{/inventario/movimientos/nuevo}">Nuevo movimiento</a></div>
<article class="card"><div class="panel-body table-wrap" style="padding-top:10px"><table><thead><tr><th>Fecha</th><th>Materia prima</th><th>Tipo</th><th>Cantidad</th></tr></thead><tbody>
<tr th:each="mov : ${movimientos}">
    <td th:text="${#dates.format(mov.fecha, 'dd/MM/yyyy HH:mm')}">06/09/2026 18:20</td>
    <td th:text="${mov.materiaPrima != null ? mov.materiaPrima.nombre : 'N/A'}">Carne de res</td>
    <td><span th:classappend="${mov.tipo == T(com.comidarapida.model.MovimientoInventario$Tipo).ENTRADA ? 'badge green' : 'badge red'}" th:text="${mov.tipo}">ENTRADA</span></td>
    <td th:text="${mov.cantidad + ' ' + (mov.materiaPrima != null ? mov.materiaPrima.unidadMedida : '')}">5 kg</td>
</tr>
</tbody></table></div></article>
</section></main></div><script th:src="@{/js/app.js}" src="/js/app.js"></script></body></html>
