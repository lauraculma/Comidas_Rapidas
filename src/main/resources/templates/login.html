<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión · Comida Rápida</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body>
<main class="auth-page"><section class="auth-art" style="background-image:url('/img/ImagenPortada.jpg');background-size:cover;background-position:center"><div class="auth-overlay"></div><div class="brand"><span class="brand-mark">CR</span><span class="brand-copy"><strong>Comida Rápida</strong><span>sabor que conecta</span></span></div><div class="auth-art-caption"><span class="auth-chip">Pedidos · inventario · clientes</span></div></section>
<section class="auth-form-wrap"><form class="auth-form" th:action="@{/login}" method="post"><div class="auth-logo"><span class="brand-mark">CR</span></div><div class="auth-heading"><div class="eyebrow">Bienvenido</div><h2>Inicia sesión</h2><p>Usa tu correo y contraseña para entrar a tu espacio de trabajo.</p></div><div th:if="${param.error}" class="notice error">Credenciales inválidas.</div><div th:if="${param.logout}" class="notice success">Sesión cerrada correctamente.</div><div class="form-group"><label>Correo electrónico</label><input name="username" type="email" placeholder="nombre@empresa.com" required></div><div class="form-group"><label>Contraseña</label><input name="password" type="password" placeholder="••••••••" required></div><button class="btn btn-primary" type="submit">Entrar al sistema</button></form></section></main></body></html>
