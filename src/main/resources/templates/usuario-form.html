<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuario · Comida Rápida</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body><div class="shell"><div th:replace="~{fragments/sidebar :: sidebar('usuarios', ${sessionRole})}"></div><main class="main"><div th:replace="~{fragments/topbar :: topbar('Administración','Usuario')}"></div><section class="content">
<div class="page-head"><div><h2>Registrar / actualizar usuario</h2><p>Datos de acceso y contacto del personal operativo.</p></div></div>
<form class="card form-card" th:action="@{/admin/usuarios/guardar}" th:object="${usuarioForm}" method="post"><div class="form-grid">
<input type="hidden" th:field="*{id}"/>
<div class="form-group"><label>Nombre</label><input th:field="*{nombre}" required></div><div class="form-group"><label>Apellido</label><input th:field="*{apellido}" required></div>
<div class="form-group"><label>Documento</label><input th:field="*{documento}" required></div><div class="form-group"><label>Teléfono</label><input th:field="*{telefono}"></div>
<div class="form-group"><label>Correo</label><input th:field="*{correoElectronico}" type="email" required></div><div class="form-group"><label>Tipo de usuario</label><select th:field="*{tipo}"><option value="">Seleccionar tipo</option><option value="administrador">Administrador</option><option value="vendedor">Vendedor</option><option value="encargadoinventario">Encargado inventario</option></select></div>
<div class="form-group full"><label>Contraseña</label><input name="contrasena" type="password"></div></div><div class="form-actions"><a class="btn btn-light" th:href="@{/admin/usuarios}">Cancelar</a><button class="btn btn-primary">Guardar usuario</button></div></form>
</section></main></div><script th:src="@{/js/app.js}" src="/js/app.js"></script></body></html>
