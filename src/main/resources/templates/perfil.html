<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil · Comida Rápida</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body><div class="shell"><div th:replace="~{fragments/sidebar :: sidebar('perfil','ADMIN')}"></div><main class="main"><div th:replace="~{fragments/topbar :: topbar('Cuenta','Mi perfil')}"></div><section class="content">
<div class="page-head"><div><h2>Mi perfil</h2><p>Actualiza tus datos de contacto sin alterar tus permisos.</p></div></div>
<form class="card form-card" th:action="@{/perfil/actualizar}" th:object="${usuario}" method="post"><div class="form-grid"><div class="form-group"><label>Nombre</label><input th:field="*{nombre}" disabled></div><div class="form-group"><label>Apellido</label><input th:field="*{apellido}" disabled></div><div class="form-group"><label>Documento</label><input th:field="*{documento}" disabled></div><div class="form-group"><label>Correo</label><input th:field="*{correoElectronico}" type="email"></div><div class="form-group"><label>Teléfono</label><input th:field="*{telefono}"></div></div><div class="form-actions"><button class="btn btn-primary">Guardar cambios</button></div></form>
</section></main></div><script th:src="@{/js/app.js}" src="/js/app.js"></script></body></html>
