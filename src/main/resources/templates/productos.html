<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Productos · Comida Rápida</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body><div class="shell"><div th:replace="~{fragments/sidebar :: sidebar('productos','ADMIN')}"></div><main class="main"><div th:replace="~{fragments/topbar :: topbar('Administración','Productos')}"></div><section class="content">
<div class="page-head"><div><h2>Catálogo de productos</h2><p>Controla precio y disponibilidad comercial de las comidas rápidas.</p></div><a class="btn btn-primary" th:href="@{/admin/productos/nuevo}">Registrar producto</a></div>
<div class="toolbar"><input class="search" data-filter-table="#tablaProductos" placeholder="Buscar por código o nombre"></div>
<article class="card"><div class="panel-body table-wrap" style="padding-top:10px"><table id="tablaProductos"><thead><tr><th>Producto</th><th>Precio</th><th>Disponibilidad</th><th></th></tr></thead><tbody>
<tr th:each="p : ${productos}"><td><div class="product-cell"><span class="product-thumb">CR</span><div><strong th:text="${p.nombre}">Hamburguesa clásica</strong><div class="muted" th:text="${p.codigo}">HAM-001</div></div></div></td><td><strong th:text="${#numbers.formatCurrency(p.precio)}">$18.000</strong></td><td><span class="badge green" th:text="${p.calcularDisponibilidad()+' disponibles'}">12 disponibles</span></td><td><a class="ghost-btn" th:href="@{/admin/productos/{id}/editar(id=${p.idProducto})}">Editar</a></td></tr>
<tr th:if="${productos==null}"><td><div class="product-cell"><span class="product-thumb">CR</span><div><strong>Hamburguesa clásica</strong><div class="muted">HAM-001</div></div></div></td><td><strong>$18.000</strong></td><td><span class="badge green">12 disponibles</span></td><td><button class="ghost-btn">Editar</button></td></tr>
</tbody></table></div></article></section></main></div><script th:src="@{/js/app.js}" src="/js/app.js"></script></body></html>
