<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar movimiento · Comida Rápida</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body><div class="shell"><div th:replace="~{fragments/sidebar :: sidebar('movimientos','INVENTARIO')}"></div><main class="main"><div th:replace="~{fragments/topbar :: topbar('Inventario','Registrar movimiento')}"></div><section class="content">
<div class="page-head"><div><h2>Registrar movimiento</h2><p>Aplica una entrada o salida sobre una materia prima existente.</p></div></div>
<form class="card form-card" th:action="@{/inventario/movimientos/guardar}" th:object="${movimiento}" method="post"><div class="form-grid"><div class="form-group"><label>Materia prima</label><select name="materiaPrimaId"><option>Seleccionar</option></select></div><div class="form-group"><label>Tipo</label><select th:field="*{tipo}"><option value="ENTRADA">Entrada</option><option value="SALIDA">Salida</option></select></div><div class="form-group"><label>Cantidad</label><input th:field="*{cantidad}" type="number" min="1"></div></div><div class="form-actions"><a class="btn btn-light" th:href="@{/inventario/movimientos}">Cancelar</a><button class="btn btn-primary">Aplicar movimiento</button></div></form>
</section></main></div><script th:src="@{/js/app.js}" src="/js/app.js"></script></body></html>
