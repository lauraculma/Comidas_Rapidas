<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes · Comida Rápida</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body><div class="shell"><div th:replace="~{fragments/sidebar :: sidebar('clientes','VENDEDOR')}"></div><main class="main"><div th:replace="~{fragments/topbar :: topbar('Ventas','Clientes')}"></div><section class="content">
<div class="page-head"><div><h2>Clientes</h2><p>Busca un cliente o registra uno nuevo antes de asociarlo a una venta.</p></div><a class="btn btn-primary" th:href="@{/vendedor/clientes/nuevo}">Registrar cliente</a></div>
<div class="toolbar"><input class="search" data-filter-table="#tablaClientes" placeholder="Buscar por documento, nombre o correo"></div>
<article class="card"><div class="panel-body table-wrap" style="padding-top:10px"><table id="tablaClientes"><thead><tr><th>Cliente</th><th>Documento</th><th>Correo</th><th></th></tr></thead><tbody>
<tr th:each="c : ${clientes}"><td><strong th:text="${c.nombre+' '+c.apellido}">Laura Gómez</strong></td><td th:text="${c.documento}">1020304050</td><td th:text="${c.correoElectronico}">laura@email.com</td><td><a class="ghost-btn" th:href="@{/vendedor/venta/nueva(cliente=${c.idCliente})}">Usar en venta</a></td></tr>
<tr th:if="${clientes==null}"><td><strong>Laura Gómez</strong></td><td>1020304050</td><td>laura@email.com</td><td><button class="ghost-btn">Usar en venta</button></td></tr>
</tbody></table></div></article></section></main></div><script th:src="@{/js/app.js}" src="/js/app.js"></script></body></html>
