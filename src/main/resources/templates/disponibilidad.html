<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disponibilidad · Comida Rápida</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body><div class="shell"><div th:replace="~{fragments/sidebar :: sidebar('catalogo', ${sessionRole})}"></div><main class="main"><div th:replace="~{fragments/topbar :: topbar('Ventas','Disponibilidad')}"></div><section class="content">
<div class="page-head"><div><h2>Disponibilidad de productos</h2><p>Productos y adiciones disponibles.</p></div></div>
<div class="catalog-grid"><article class="card menu-card" th:each="p : ${productos}"><img th:if="${p.imagen != null and !#strings.isEmpty(p.imagen)}" class="menu-visual menu-img" th:src="@{${'/img/' + p.imagen}}" alt=""><div th:unless="${p.imagen != null and !#strings.isEmpty(p.imagen)}" class="menu-visual">🍔</div><h4 th:text="${p.nombre}">Hamburguesa clásica</h4><div class="menu-foot"><strong th:text="${#numbers.formatCurrency(p.precio)}">$18.000</strong><span class="badge green" th:text="${p.calcularDisponibilidad()+' disponibles'}">12 disponibles</span></div></article>
<article class="card menu-card" th:if="${productos==null}"><div class="menu-visual">🍔</div><h4>Hamburguesa clásica</h4><p>Carne, pan y acompañamientos.</p><div class="menu-foot"><strong>$18.000</strong><span class="badge green">12 disponibles</span></div></article><article class="card menu-card" th:if="${productos==null}"><div class="menu-visual">🌭</div><h4>Perro especial</h4><p>Disponibilidad limitada.</p><div class="menu-foot"><strong>$15.500</strong><span class="badge amber">4 disponibles</span></div></article></div>
</section></main></div><script th:src="@{/js/app.js}" src="/js/app.js"></script></body></html>
