<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuarios · Comida Rápida</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body><div class="shell"><div th:replace="~{fragments/sidebar :: sidebar('usuarios','ADMIN')}"></div><main class="main"><div th:replace="~{fragments/topbar :: topbar('Administración','Usuarios')}"></div><section class="content">
<div class="page-head"><div><h2>Usuarios del sistema</h2><p>Administra el personal con acceso y el estado de sus cuentas.</p></div><a class="btn btn-primary" th:href="@{/admin/usuarios/nuevo}">Registrar usuario</a></div>
<div class="toolbar"><input class="search" data-filter-table="#tablaUsuarios" placeholder="Buscar por nombre, correo o documento"><select class="field"><option>Todos los tipos</option><option>Administrador</option><option>Vendedor</option><option>Inventario</option></select></div>
<article class="card"><div class="panel-body table-wrap" style="padding-top:10px"><table id="tablaUsuarios"><thead><tr><th>Usuario</th><th>Documento</th><th>Tipo</th><th>Estado</th><th></th></tr></thead><tbody>
<tr th:each="u : ${usuarios}"><td><div class="product-cell"><span class="avatar" th:text="${#strings.substring(u.nombre,0,1)}">M</span><div><strong th:text="${u.nombre+' '+u.apellido}">Mariana Torres</strong><div class="muted" th:text="${u.correoElectronico}">mariana@empresa.com</div></div></div></td><td th:text="${u.documento}">1022334455</td><td><span class="badge neutral">Usuario</span></td><td><span class="badge green">Activo</span></td><td><a class="ghost-btn" th:href="@{/admin/usuarios/{id}/editar(id=${u.idUsuario})}">Editar</a></td></tr>
<tr th:if="${usuarios==null}"><td><div class="product-cell"><span class="avatar">M</span><div><strong>Mariana Torres</strong><div class="muted">mariana@empresa.com</div></div></div></td><td>1022334455</td><td><span class="badge neutral">VENDEDOR</span></td><td><span class="badge green">Activo</span></td><td><button class="ghost-btn">Editar</button></td></tr>
</tbody></table></div></article></section></main></div><script th:src="@{/js/app.js}" src="/js/app.js"></script></body></html>
