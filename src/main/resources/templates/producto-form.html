<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Producto · Comida Rápida</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body><div class="shell"><div th:replace="~{fragments/sidebar :: sidebar('productos', ${sessionRole})}"></div><main class="main"><div th:replace="~{fragments/topbar :: topbar('Administración','Producto')}"></div><section class="content">
<div class="page-head"><div><h2>Registrar / actualizar producto</h2><p>Define la información comercial del producto.</p></div></div>
<form class="card form-card" th:action="@{/admin/productos/guardar}" th:object="${producto}" method="post" enctype="multipart/form-data"><div class="form-grid">
<input type="hidden" th:field="*{idProducto}"/>
<div class="form-group"><label>Código</label><input th:field="*{codigo}" placeholder="HAM-001" required></div><div class="form-group"><label>Nombre</label><input th:field="*{nombre}" required></div><div class="form-group"><label>Precio</label><input th:field="*{precio}" type="number" min="0" required></div><div class="form-group full"><label>Imagen del producto</label><input name="imagenFile" type="file" accept="image/*"><small class="muted">Selecciona una imagen desde tu computadora (opcional). Si no agregas una, se mostrará un ícono.</small></div></div>
<div class="form-actions"><a class="btn btn-light" th:href="@{/admin/productos}">Cancelar</a><button class="btn btn-primary">Guardar producto</button></div></form>
</section></main></div><script th:src="@{/js/app.js}" src="/js/app.js"></script></body></html>
