<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Materia prima · Comida Rápida</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body><div class="shell"><div th:replace="~{fragments/sidebar :: sidebar('inventario', ${sessionRole})}"></div><main class="main"><div th:replace="~{fragments/topbar :: topbar('Inventario','Materia prima')}"></div><section class="content">
<div class="page-head"><div><h2>Registrar materia prima</h2><p>Agrega un ingrediente con su unidad de medida y stock inicial.</p></div></div>
<form class="card form-card" th:action="@{/inventario/materias/guardar}" th:object="${materiaPrima}" method="post"><div class="form-grid"><div class="form-group"><label>Código</label><input th:field="*{codigo}" required></div><div class="form-group"><label>Nombre</label><input th:field="*{nombre}" required></div><div class="form-group"><label>Stock actual</label><input th:field="*{stockActual}" type="number" min="0" required></div><div class="form-group"><label>Unidad de medida</label><input th:field="*{unidadMedida}" placeholder="kg, g, und..." required></div><div class="form-group"><label>Estado</label><input th:field="*{estado}"></div></div><div class="form-actions"><a class="btn btn-light" th:href="@{/inventario}">Cancelar</a><button class="btn btn-primary">Guardar</button></div></form>
</section></main></div><script th:src="@{/js/app.js}" src="/js/app.js"></script></body></html>
