<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historial cliente · Comida Rápida</title><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body><div class="shell"><div th:replace="~{fragments/sidebar :: sidebar('clientes', ${sessionRole})}"></div><main class="main"><div th:replace="~{fragments/topbar :: topbar('Ventas','Historial cliente')}"></div><section class="content">
<div class="page-head"><div><h2>Historial de pedidos</h2><p>Pedidos asociados al cliente.</p></div><a class="btn btn-light" th:href="@{/vendedor/clientes}">Volver</a></div>
<article class="card"><div class="panel-body table-wrap"><table><thead><tr><th>Pedido</th><th>Fecha</th><th>Total</th><th>Estado</th><th>Detalles</th></tr></thead><tbody>
<tr th:each="p : ${pedidos}">
  <td th:text="${p.idPedido}">#1001</td>
  <td th:text="${#dates.format(p.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
  <td th:text="${#numbers.formatCurrency(p.total)}">$41.000</td>
  <td><span th:classappend="${p.confirmado}? 'badge green' : 'badge amber'" th:text="${p.confirmado}? 'Confirmado' : 'Pendiente'">Confirmado</span></td>
  <td>
    <table style="width:100%"><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio</th></tr></thead>
    <tbody>
      <tr th:each="d : ${p.detalles}">
        <td th:text="${d.producto != null ? d.producto.nombre : 'N/A'}">Hamburguesa</td>
        <td th:text="${d.cantidad}">2</td>
        <td th:text="${#numbers.formatCurrency(d.precioUnitario)}">$18.000</td>
      </tr>
    </tbody></table>
  </td>
</tr>
<tr th:if="${pedidos==null || pedidos.size()==0}"><td colspan="5">No hay pedidos para este cliente.</td></tr>
</tbody></table></div></article>
</section></main></div><script th:src="@{/js/app.js}" src="/js/app.js"></script></body></html>
