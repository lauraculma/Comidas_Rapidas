<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar cliente · Comida Rápida</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css"></head><body><div class="shell"><div th:replace="~{fragments/sidebar :: sidebar('clientes','VENDEDOR')}"></div><main class="main"><div th:replace="~{fragments/topbar :: topbar('Ventas','Registrar cliente')}"></div><section class="content">
<div class="page-head"><div><h2>Registrar cliente</h2><p>Crea un cliente para asociarlo posteriormente a un pedido.</p></div></div>
<form class="card form-card" th:action="@{/vendedor/clientes/guardar}" th:object="${cliente}" method="post"><div class="form-grid">
<div class="form-group"><label>Nombre</label><input th:field="*{nombre}" required></div><div class="form-group"><label>Apellido</label><input th:field="*{apellido}"></div><div class="form-group"><label>Documento</label><input th:field="*{documento}" required></div><div class="form-group"><label>Correo electrónico</label><input th:field="*{correoElectronico}" type="email"></div></div>
<div class="form-actions"><a class="btn btn-light" th:href="@{/vendedor/clientes}">Cancelar</a><button class="btn btn-primary">Registrar cliente</button></div></form>
</section></main></div><script th:src="@{/js/app.js}" src="/js/app.js"></script></body></html>
