spring.application.name=comida-rapida

server.port=8082

# PostgreSQL datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/comida-rapida
spring.datasource.username=postgres
spring.datasource.password=Bullrock
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: profile-based credentials using env variables
# spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/comida-rapida}
# spring.datasource.username=${JDBC_DATABASE_USERNAME:postgres}
# spring.datasource.password=${JDBC_DATABASE_PASSWORD:postgres}
